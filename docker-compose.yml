services:
  db:
    build: ./db
    container_name: hr-assistant-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${postgres_user}
      POSTGRES_PASSWORD: ${postgres_password}
      POSTGRES_DB: ${postgres_db}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${postgres_user} -d ${postgres_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: hr-assistant-app

    depends_on:
      db:
        condition: service_healthy

    env_file: .env

    ports:
      - "8000:8000"

    restart: unless-stopped

  demo:
    build: ./demo
    container_name: hr-assistant-demo
    ports:
      - "5173:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
