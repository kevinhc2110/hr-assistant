[project]
name = "hr-assistant"
version = "0.1.0"
description = ""
authors = [
    {name = "Kevin Herrera",email = "114835840+kevinhc2110@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn (>=0.48.0,<0.49.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "python-multipart (>=0.0.30,<0.0.31)",
    "numpy (>=2.4.6,<3.0.0)",
    "google-genai (>=2.8.0,<3.0.0)",
]

[tool.poetry]
packages = [{include = "hr_assistant", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
